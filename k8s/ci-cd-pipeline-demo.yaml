apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-pipeline-demo
  namespace: default
  labels:
    app: ci-cd-pipeline-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ci-cd-pipeline-demo
  template:
    metadata:
      labels:
        app: ci-cd-pipeline-demo
    spec:
      containers:
        - name: ci-cd-pipeline-demo
          image: ghcr.io/kevinwright1-dev/ci-cd-pipeline-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ci-cd-pipeline-demo
  namespace: default
spec:
  type: NodePort
  selector:
    app: ci-cd-pipeline-demo
  ports:
    - port: 80
      targetPort: 5000
